function receiptTotal(){return S.requiredCount??2;}
function receiptCount(){if(!S.requested)return 0;return S.newRequest?(S.confirmed?1:0):(S.confirmed?2:1);}
function receiptRatio(){return S.requested?`${receiptCount()} / ${receiptTotal()}`:'Not requested';}
function receiptPercent(){return S.requested&&receiptTotal()?Math.round(receiptCount()/receiptTotal()*100):0;}
function receiptComplete(){return S.requested&&receiptCount()>=receiptTotal();}

function pricingPage(){return publicShell(`<main class="publiccontent"><div class="publichead"><span class="eyebrow">SIMPLE, PROJECT-BASED PRICING</span><h1>One project.<br>A complete handoff.</h1><p>Build before you buy. Pay when your handbook is ready to share.</p><span class="pill amber">Prototype pricing · validation baseline</span></div><div class="grid3"><section class="card pricecard"><h3>Free draft</h3><p class="caption mt8">See your handbook take shape.</p><div class="price">$0 <sub>/ to explore</sub></div><p class="note">1 active free draft · Owner preview only</p>${ticklist(['Up to 3 guides and 20 steps','100 MiB project storage','10 AI-generated steps, once per workspace','Screenshot review and manual editing','Private creator preview'])}${btn('Start a free draft','auth','block','arrow')}<p class="note mt16">No client invitations or formal exports. Inactive drafts enter cleanup after 30 days, with advance notice.</p></section><section class="card pricecard featured"><span class="pill green pricinglabel">FOR YOUR NEXT HANDOFF</span><h3>Project pack</h3><p class="caption mt8">Everything for one client project.</p><div class="price">$19 <sub>/ project</sub></div><p class="note"><b>90 days of hosting.</b> No automatic renewal.</p>${ticklist(['10 guides · 200 steps','1 GiB total project storage','300 AI-generated steps, valid for 90 days','Up to 50 invited client emails','Version history, questions and receipts','PDF + offline HTML exports'])}${btn('Create your handbook','auth','primary block','arrow')}<p class="note mt16">Up to 200 new exports per 90-day window, 10 per day. Each pack is bound to one project.</p></section><section class="card pricecard"><h3>Hosting extension</h3><p class="caption mt8">Keep an existing handoff available.</p><div class="price">$9 <sub>/ 90 days</sub></div><p class="note">For an existing, recoverable project.</p>${ticklist(['Keep editing and sharing','Retain eligible version history','New export allowance in the new window','Preserve remaining hosting time','No additional AI credits'])}${btn('Manage a project','billing','block','clock')}<p class="note mt16">At expiry, client access stops. Owners have a 30-day read-only export window before content cleanup.</p></section></div><p class="note center mt24">USD. Tax, where applicable, is shown by the payment provider before purchase. Prices and limits shown are prototype assumptions.</p><section style="max-width:780px;margin:35px auto 0"><h2 class="mb16">A few things to know</h2>${[['Does it renew automatically?','No. A project pack provides 90 × 24 hours of hosting from verified payment. You choose whether to extend it.'],['Do my clients need a paid account?','No. Clients verify their invited email to access your handbook. Only you buy a project pack.'],['What happens when hosting ends?','Client access, editing and AI stop. The owner has 30 days to read and export the last eligible published content.'],['Do I have to use AI?','No. Manual editing, publishing and exporting are available without AI.'],['What does a confirmation mean?','It records receipt of a named handbook version and its checklist. It is not an electronic signature or automatic contract acceptance.']].map(([q,a])=>`<details class="faqrow"><summary>${q}${ic('plus')}</summary><p>${a}</p></details>`).join('')}</section></main>`);}
function examplesPage(){return publicShell(`<main class="publiccontent"><div class="publichead"><span class="eyebrow">LOOK AT THE FINISH LINE</span><h1>A handoff you can actually use.</h1><p>Explore fictional examples before you make your own. No client data, no sign-in required for these public samples.</p></div><div class="grid3"><article class="card"><div style="padding:22px;background:#edf5e7;height:218px;overflow:hidden">${miniHandbook()}</div><div class="pad"><span class="pill green">Website handoff</span><h2 style="font-size:20px;margin:13px 0 8px">Northstar Studio</h2><p class="caption">Content updates, media, access roles and a clear handoff checklist.</p><div class="row gap8 mb24"><span class="tag">3 guides</span><span class="tag">12 steps</span><span class="tag">v2</span></div>${act('Open sample handbook','open-public-sample','primary block','external')}</div></article><article class="card"><div style="height:218px;background:#f0f3ed;padding:25px"><div class="coverpreview" style="min-height:220px;padding:20px;transform:rotate(2deg)"><span class="eyebrow">ATLAS / CLIENT PORTAL</span><h2 style="font-size:23px;margin:22px 0 12px">Your new portal.<br>Everything in place.</h2><div class="steppreviewline"></div><div class="steppreviewline"></div><span class="tag mt8">Implementation checklist</span></div></div><div class="pad"><span class="pill blue">Software implementation</span><h2 style="font-size:20px;margin:13px 0 8px">Atlas client portal</h2><p class="caption">A structure for setup, everyday tasks, permissions and ongoing support.</p><div class="row gap8 mb24"><span class="tag">Starter structure</span><span class="tag">No invented steps</span></div>${act('Use this starter','use-software','block','copy')}</div></article><article class="card"><div style="height:218px;background:#f5f1e5;display:grid;place-items:center"><div class="emptyart"><div class="paper"><i></i><i></i><i></i></div><div class="plus">+</div></div></div><div class="pad"><span class="pill">Blank handbook</span><h2 style="font-size:20px;margin:13px 0 8px">Your own workflow</h2><p class="caption">Start with the essentials and arrange your guides around the project.</p><div class="row gap8 mb24"><span class="tag">Cover</span><span class="tag">Checklist</span><span class="tag">Support</span></div>${act('Start from blank','use-blank','block','plus')}</div></article></div><div class="card pad mt32"><div class="row between wrap"><div><h3>See what leaves the platform</h3><p class="caption mt8" style="margin-bottom:0">Download a fictional PDF or a self-contained HTML sample.</p></div><div class="row gap8">${act('Sample PDF','download-pdf','','download')}${act('Offline HTML ZIP','download-zip','','download')}</div></div></div></main>`);}
function helpPage(){return publicShell(`<main class="publiccontent"><div class="publichead"><span class="eyebrow">HANDLIO HELP CENTER</span><h1>A little help, right when you need it.</h1><p>From your first screenshot to a version your client can confirm.</p><div class="searchbox" style="margin-top:23px;text-align:left">${ic('search')}<input id="helpSearch" placeholder="Search guides, sharing, billing…"></div></div><div class="grid3" id="helpCards">${[['image','Prepare & protect screenshots','Formats, local review and irreversible redaction.','assets'],['edit','Build a clear guide','Steps, expected results and optional AI suggestions.','editor'],['users','Share with a client','Invited email, roles and access troubleshooting.','handoff'],['history','Publish the right version','Drafts, release checks and version-specific receipts.','versions'],['download','Export your handbook','PDF sizes, offline HTML and export troubleshooting.','exports'],['credit','Billing & hosting','Project packs, extensions and the owner export window.','billing']].map(([i,t,d,r])=>`<a href="#${r}" class="card pad helpcard">${ic(i)}<h3 class="mt16 mb8">${t}</h3><p class="caption" style="margin-bottom:0">${d}</p><div class="mt16 accent small">Read the guide ${ic('arrow')}</div></a>`).join('')}</div><div class="card pad mt32"><div class="row start between wrap"><div style="max-width:470px"><h2>Still need a hand?</h2><p class="caption mt8">Send a question or report an access issue. Never include passwords, verification codes, card details or unredacted screenshots.</p></div>${act('Contact support','contact-support','primary','mail')}</div></div></main>`);}
function policyPage(kind){const data={terms:{eyebrow:'SERVICE TERMS',title:'Clear expectations, from the start.',intro:'A prototype of the terms page. The operator details, governing terms and jurisdiction have not been finalized.',parts:[['The service','Handlio is designed to help creators prepare and share client handbooks. A creator owns a workspace and chooses who can access each client project.'],['Project purchases and hosting','The proposed project pack is assigned to one project and has a stated hosting end time. It does not renew automatically. The final price and applicable tax must be shown before payment.'],['Version receipts','Confirmation records refer to a particular handbook version and checklist. They must not be presented as notarized identity, an electronic signature, or automatic contract acceptance.'],['Your content and responsibilities','Creators should upload only content they are authorized to use and should review screenshots before upload. Access restrictions cannot prevent a recipient from making a local copy of visible content.']]},privacy:{eyebrow:'PRIVACY & DATA',title:'Know what goes in.<br>Know what stays.',intro:'Product-policy design draft. Actual processors, region, operator information and legal bases require review before launch.',parts:[['Screenshot handling','Unreviewed source screenshots stay in browser memory during preparation. Only a reviewed, flattened version is intended to be uploaded to the service. This prototype does not upload files.'],['Optional AI processing','AI suggestions are user-triggered and use only selected project material. Supplier processing and retention details must be disclosed before the production service is enabled.'],['Content lifecycle','The proposed project pack includes 90 days of hosting, followed by a 30-day owner-only read and export window. Export artifacts are temporary. Deleted content and backups follow the approved cleanup policy.'],['Data requests','Owners and clients need a route to request access, correction, export or deletion. Financial and security records are managed separately where a justified retention obligation applies.']]},refund:{eyebrow:'REFUNDS & SUPPORT',title:'An issue with a purchase?<br>Let’s review it.',intro:'The final refund window and regional exceptions are not set. This prototype demonstrates the support flow, not a binding refund policy.',parts:[['Before you pay','Build and inspect your handbook before purchasing. The project, hosting period, export limits and non-renewing price must be clear at checkout.'],['Requesting a review','Choose the relevant order in Billing & usage, explain the issue, and submit a request. Submitting a request does not mean it has been approved or that content is immediately deleted.'],['Provider verification','Refund completion is based on a verified payment-provider result. Pending or failed refunds must not be displayed as successful.'],['Downloaded material','The service cannot retrieve files that have already been downloaded or independently copied. Your request will be reviewed under the finalized terms and applicable requirements.']]}}[kind];return publicShell(`<main class="publiccontent"><div class="publichead"><span class="eyebrow">${data.eyebrow}</span><h1>${data.title}</h1><p>${data.intro}</p></div><div class="policytext" style="margin:auto">${notice('<b>Draft for product review.</b> Not live legal terms. Operator identity, support address and final policy text are launch blockers.','amber','alert')}<nav class="tabs mt24">${['terms','privacy','refund'].map(x=>`<a href="#${x}" class="tab ${kind===x?'active':''}">${x==='terms'?'Terms of service':x==='privacy'?'Privacy & data':'Refunds'}</a>`).join('')}</nav>${data.parts.map(([h,p])=>`<h2>${h}</h2><p>${p}</p>`).join('')}<div class="divider"></div><div class="row between wrap"><span class="note">Design draft · October 11, 2026</span>${act(kind==='refund'?'Request purchase review':'Submit a data or policy request',kind==='refund'?'refund-request':'contact-support','','mail')}</div></div></main>`);}
function authLayout(body){return `<div class="authpage"><aside class="authbrand">${logo()}<span class="eyebrow">CLEAR GUIDES. SMOOTH HANDOFFS.</span><h1 class="mt16">Less explaining.<br>More confidence.</h1><p>Give your client one thoughtful place for the steps, the answers, and the version that matters.</p><div class="herocard"><div class="row between"><b class="small">Northstar website handoff</b>${pill('v2','green')}</div><div class="divider"></div>${[['checkcircle','Handbook published','12 steps, clearly organized'],['users','Client access verified','Private, project-specific invitations'],['checkcircle','Receipt requested','Bound to this exact version']].map(([i,t,s])=>`<div class="row start mb16">${ic(i)}<div><b class="small">${t}</b><div class="note">${s}</div></div></div>`).join('')}</div><div class="footerquiet">Illustrative project · No real client information</div></aside><main class="authbody"><div class="authbox">${logo()}${body}</div></main></div>`;}
function authPage(verify=false){if(!verify)return authLayout(`<span class="eyebrow">YOUR NEXT HANDOFF STARTS HERE</span><h1>Welcome to Handlio.</h1><p class="caption">Create an account or sign in with your email.<br>No password to remember.</p><form data-form="login">${field('Work email',input('loginEmail','','you@yourstudio.com','type="email" required autocomplete="email"'))}${btn('Continue with email',null,'primary block','arrow','type="submit"')}<div id="authError" class="inputerror" role="alert"></div></form><p class="note mt24">By continuing, you agree to the <a class="accent" href="#terms">Terms of service</a> and acknowledge the <a class="accent" href="#privacy">Privacy notice</a>.</p><div class="divider"></div><div class="row gap8 muted small">${ic('lock')} Email verification only. No credit card required.</div><div class="prototypesplash">Demo mode: use any example email. No message will be sent.</div>`);return authLayout(`<a href="#auth" class="linkbtn small">${ic('back')} Change email</a><h1>Check your inbox.</h1><p class="caption">Enter the 6-digit code sent to<br><b style="color:var(--ink)">${esc(S.otpMail)}</b>.</p><form data-form="verify-owner">${field('Verification code',input('ownerCode','','123456','class="codeinput" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required'))}${btn('Verify and continue',null,'primary block','arrow','type="submit"')}<div id="verifyError" class="inputerror" role="alert"></div></form><div class="row between mt24"><span class="note">Code expires in 10 minutes.</span><button class="linkbtn" data-action="resend-code">Resend code</button></div><div class="prototypesplash">Prototype verification code: <b class="monotext">123456</b><br><span class="note">Production: 60-second resend limit and rate-limited attempts.</span></div>`);}
function onboardingPage(){return authLayout(`<span class="eyebrow">ONE LAST THING</span><h1>Make it your workspace.</h1><p class="caption">Your studio details help clients know who’s behind the handbook. You can change these later.</p><form data-form="onboarding">${field('Your name',input('ownerName',S.owner,'','required maxlength="120"'))}${field('Workspace name',input('workspaceName',S.workspace,'','required maxlength="120"'))}${field('Support email',input('supportEmail','hello@pine.example','','type="email" required'))}${field('Time zone','<select id="timezone"><option value="America/New_York">America / New York (ET)</option><option value="Europe/London">Europe / London</option><option value="Asia/Shanghai">Asia / Shanghai</option></select>','Deadlines show an exact date and your selected time zone.')}${btn('Create my workspace',null,'primary block','arrow','type="submit"')}</form><div class="row gap8 note mt24">${ic('user')}One creator per workspace in this version.</div>`);}

function assetsPage(error=false){const names=['01-pages-list.png','02-edit-heading.png','03-preview.png','04-publish.png','05-check-live.png','06-access-settings.png'];return shell(`${topTitle('Prepare your screenshots','Review what your clients will see. Original files stay local until you confirm.',btn('Continue to guide','editor','primary','arrow'))}<div class="wizardbar"><div class="wizardstep"><b>✓</b>Project details</div><div class="line"></div><div class="wizardstep active"><b>2</b>Review & protect</div><div class="line"></div><div class="wizardstep"><b>3</b>Build your handbook</div></div><div class="uploadzone mb24" id="dropzone"><div>${ic('upload')}</div><h3>Drop screenshots here, or ${act('choose files','choose-files','sm')}</h3><p class="caption" style="margin:7px 0">PNG, JPEG or WebP · Up to 20 files per batch · 20 MiB per file</p><p class="note" style="margin:0">Max 8,000 px per side and 20 million pixels. Review locally before upload.</p><input type="file" id="assetFileInput" accept="image/png,image/jpeg,image/webp" multiple hidden></div>${error?notice('<b>2 files need attention.</b> 4 valid screenshots are preserved. Correct or remove the failed items without starting again.','amber','alert'):notice('<b>Review first, upload second.</b> Remove personal details, passwords, API keys and client secrets. Only the reviewed image should leave your browser.','','shield')}<div class="row between mt24 mb16"><div class="row"><h3>Screenshot batch</h3><span class="tag">${localAssets.length||6} files</span></div><div class="row gap8">${btn('View error states','upload-error','sm')}${btn('Review sensitive details','redact','sm','shield')}</div></div>${error?`<div class="card mb24"><div class="tablewrap"><table><thead><tr><th>#</th><th>File</th><th>Validation result</th><th>How to fix it</th><th>Action</th></tr></thead><tbody><tr style="background:#fff8f3"><td>05</td><td>05-check-live.png<br><span class="note">26.8 MiB · 9,200 × 3,000</span></td><td>${pill('Too large','red')}<div class="note mt8">File size, side and total pixels exceed limits.</div></td><td>Resize and reselect the screenshot.</td><td>${act('Replace','replace-file','sm','refresh')}</td></tr><tr style="background:#fff8f3"><td>06</td><td>06-access-settings.webp<br><span class="note">3.2 MiB</span></td><td>${pill('Decode failed','red')}<div class="note mt8">The image could not be read.</div></td><td>Export a new static image.</td><td>${act('Remove','remove-failed','sm','trash')}</td></tr><tr><td>01–04</td><td>4 reviewed screenshots</td><td>${pill('Ready','green',true)}</td><td>Kept in the original order.</td><td>${btn('Continue review','redact','sm')}</td></tr></tbody></table></div></div>`:''}<div class="grid3" id="assetGrid">${(localAssets.length?localAssets:names.map((name,i)=>({name,demo:true,status:i===5?'review':'ready'}))).map((a,i)=>`<article class="card"><div class="assetthumb">${a.url?`<img src="${a.url}" style="height:100%;width:100%;object-fit:contain" alt="Local screenshot ${i+1}">`:cms(i%2?'edit':'pages',i===5)}</div><div class="pad16"><div class="row between gap8"><b class="small ellipsis">${esc(a.name)}</b>${a.status==='error'?pill('Error','red'):a.status==='review'?pill('Needs review','amber'):'<span class="assetstatus">'+ic('check')+'</span>'}</div><div class="row between mt8"><span class="note">${a.demo?'1,440 × 900 · 348 KiB':a.error||a.dimensions||'Local preview only'}</span>${act('Review','review-asset','sm', 'shield',`data-asset-index="${i}"`)}</div></div></article>`).join('')}</div><p class="note mt16">Prototype files remain in this browser session. No network uploads are performed.</p>`,{project:true,tab:'assets'});}
function redactPage(){return shell(`${topTitle('Protect sensitive details','Screenshot 2 of 6 · Review on this device before any upload.',btn('Back to assets','assets','ghost','back'))}<div class="split" style="grid-template-columns:minmax(0,1fr) 297px"><div class="card"><div class="screenshot-tools"><button class="tool" data-action="canvas-pan" aria-label="Inspect image">${ic('cursor')}</button><button class="tool active" data-action="canvas-redact" aria-label="Draw irreversible redaction">${ic('square')}</button><span class="note" style="margin-left:5px">Opaque redaction</span><span class="grow"></span>${act('Undo last','undo-redact','sm','undo')}${act('Fit image','fit-redact','sm','search')}</div><div style="background:#edf2e8;padding:23px"><canvas id="redactCanvas" class="redactcanvas" width="1080" height="630" aria-label="Draw a rectangle over sensitive sample content"></canvas></div><div class="annotationcaption"><span>02-edit-heading.png · Local source</span><span id="redactionCount">2 redacted regions</span></div></div><aside class="column"><div class="card pad"><div class="row gap8 mb16">${ic('shield')}<h3>Before uploading</h3></div><p class="caption">Drag solid boxes over details that do not belong in your client handbook.</p><div class="divider"></div><div class="reviewchecks"><label class="check"><input type="checkbox" id="reviewPersonal"><span>I checked names, email addresses and other personal information.</span></label><label class="check"><input type="checkbox" id="reviewSecrets"><span>I checked passwords, tokens and client-confidential information.</span></label></div><div class="alert amber mt16">${ic('lock')}<div><b>Flattened, not hidden.</b><br>Applied redaction is merged into image pixels. A cloud copy cannot undo it.</div></div>${act('Apply & keep reviewed image','apply-redaction','primary block mt24','check','id="applyRedaction" disabled')}<p class="note mt16" style="margin-bottom:0">Prototype: keeps only a processed local image. Nothing is up function editorPage(ai=false,conflict=false){const idx=S.selectedStep;const title=S.editedTitle||stepTitles[idx];const body=S.editedBody||stepBodies[idx];const editor=`<div class="editorbar"><div class="row gap8"><a href="#project" class="iconbtn" aria-label="Back to project">${ic('back')}</a><div><b class="small">Update website content</b><div class="note">${esc(S.clientName)} · Guide 02 / 03</div></div><span class="revisiontag">Draft v${S.version+1}</span></div><div class="row gap8"><span class="note" id="saveStatus">${ic('check')} ${S.saving}</span>${btn('Preview','preview','sm','eye')}${btn('Check & publish','validation','primary sm','arrow')}</div></div><div class="editorshell"><aside class="stepspanel"><div class="row between mb16"><span class="navlabel" style="padding:0;margin:0">GUIDE OUTLINE</span><button class="iconbtn" data-action="guide-options" aria-label="Guide options">${ic('more')}</button></div><div class="field"><select id="guideSelect" style="font-size:11px"><option>Getting started</option><option selected>Update website content</option><option>Manage your media</option></select></div><div class="row between mb8"><span class="note">5 steps</span><span class="note">${ic('sort')}</span></div>${stepTitles.map((t,i)=>`<button class="stepitem ${idx===i?'active':''}" style="text-align:left;width:100%" data-action="select-step" data-step="${i}"><span class="stepnum">${i+1}</span><div class="grow"><h4>${esc(i===idx?title:t)}</h4><div class="note mt8">${i===1&&!S.aiAccepted&&!S.aiRejected?'AI suggestion to review':'Screenshot + instruction'}</div></div></button>`).join('')}<div class="divider"></div>${act('Add a step','add-step','block sm','plus')}<p class="note mt24">Reorder with the up/down controls or drag in the outline.</p><div class="row mt16">${act('Up','move-step-up','sm','arrowup')}${act('Down','move-step-down','sm','arrowdown')}</div></aside><main class="editormain"><div class="row between mb16"><span class="eyebrow">STEP ${String(idx+1).padStart(2,'0')} OF ${String(stepTitles.length).padStart(2,'0')}</span><div class="row gap4">${act('Duplicate','duplicate-step','ghost sm','copy')}${act('Remove','remove-step','ghost sm','trash')}</div></div><div class="field"><input id="stepTitle" class="titleinput" value="${esc(title)}" maxlength="120" aria-label="Step title"></div><div class="card mb16"><div class="screenshot-tools">${[['cursor','Select'],['square','Rectangle'],['arrow','Arrow'],['text','Text'],['crop','Crop']].map(([i,t],n)=>`<button class="tool ${n===1?'active':''}" data-action="annotation-tool" data-tool="${t}" aria-label="${t}">${ic(i)}</button>`).join('')}<span class="grow"></span>${btn('Redact','redact','sm','shield')}${act('Replace','replace-step-image','sm','image')}</div>${cms(idx===0?'pages':idx===3?'publish':'edit',true)}<div class="annotationcaption"><span>${ic('shield')} Reviewed image · Flattened</span><button class="linkbtn" style="font-size:10px" data-action="zoom-image">View larger ${ic('search')}</button></div></div>${field('Instruction',textarea('stepBody',body,4))}${field('Image description',input('imageAlt','Home page editor with the Hero heading field highlighted.'),'Shown to screen readers and when the image is unavailable.')}<div class="row between"><span class="note">Your current draft is not visible to clients.</span>${act('Next step','next-step','sm','arrow')}</div></main><aside class="editorright"><div class="row between mb24"><h3>Step details</h3><button class="iconbtn" data-action="step-details-help" aria-label="Step details help">${ic('help')}</button></div>${field('Expected result',textarea('expectedResult',idx===0?'The Home page editor is open.':'The new heading appears in the editor. The live website is not changed yet.',4))}${field('Before you start',textarea('prerequisites','You are signed in with the Content editor role.',3))}${field('Caution · optional',textarea('caution','Do not publish until you have reviewed the preview.',3))}<div class="divider"></div><div class="row between"><span class="row gap8"><span class="accent">${ic('spark')}</span><b class="small">AI suggestions</b></span><span class="tag">Optional</span></div>${(S.aiAccepted||S.aiRejected)?`<div class="suggestion"><b class="small">${S.aiAccepted?'Suggestion applied':'Suggestion dismissed'}</b><p>Changes are limited to this step. Review the final text before publishing.</p>${act('Generate again','generate-ai','block sm','spark')}</div>`:`<div class="suggestion"><span class="pill amber">Needs your review</span><p>Clarify that editing the field does not update the live website.</p>${btn('Review suggestion','ai-review','block sm','spark')}</div>`}<p class="note">276 / 300 generated steps remaining.<br>Successful generation uses credits, even if you reject the result.</p><a href="#save-conflict" class="linkbtn" style="font-size:10px">View save-conflict state</a></aside></div>`;let page=shell(editor,{project:false,compact:true,title:'Guide editor'});if(ai){page+=modal('Review the AI suggestion','Only this reviewed screenshot and its selected text were used. Results below are simulated.',`${notice('AI may misread screenshots. Check labels, sequence and expected results before applying anything.','amber','spark')}<div class="grid2 mt24"><div class="outlineinfo"><span class="eyebrow">YOUR CURRENT TEXT</span><h3 class="mt16">Update the page heading</h3><p class="caption mt16">${stepBodies[1]}</p></div><div class="outlineinfo" style="background:#f1f8ed;border-color:#c9ddc0"><span class="eyebrow">SUGGESTED REVISION</span><h3 class="mt16">Edit the heading, then preview</h3><p class="caption mt16">Replace the text in the Hero heading field with your approved copy. This only updates the draft. Open Preview to check the change before publishing.</p></div></div><div class="row gap8 mt24"><span class="tag">Source: Step 02</span><span class="tag">Reviewed image</span><span class="tag">1 generated step used</span></div><label class="check mt24"><input id="aiChecked" type="checkbox"><span>I checked the suggestion against the screenshot and my client’s workflow.</span></label>`,act('Reject suggestion','reject-ai','ghost')+`<div class="row gap8">${btn('Keep editing','editor')}${act('Apply to this step','accept-ai','primary','check','disabled id="applyAI"')}</div>`,true);}if(conflict){page+=modal('This draft changed in another tab.','Your edits are preserved here. Choose how to reconcile before saving.',`${notice('Draft conflict · Server revision 19 is newer than your starting revision 18. Your changes have not overwritten it.','amber','history')}<div class="diffrow mt24 card"><div class="diffcell before"><span class="eyebrow">YOUR UNSAVED TEXT</span><p>Replace the Hero heading and publish your changes.</p></div><div class="diffcell after"><span class="eyebrow">NEWER SAVED REVISION</span><p>Replace the Hero heading. <mark>Preview before publishing.</mark></p></div></div>${field('<span style="display:block;margin-top:24px">Merged instruction</span>',textarea('mergeText','Replace the Hero heading with approved copy. Preview the page before publishing.',3))}<p class="note">The selected merge creates a new revision. Published v${S.version} stays unchanged.</p>`,act('Copy my unsaved text','copy-unsaved','ghost','copy')+`<div class="row gap8">${act('Use newer version','use-server','')}${act('Save merged draft','merge-conflict','primary','check')}</div>`,true);}return page;}
function handbookPage(){return shell(`${topTitle('Shape the handoff','A complete manual: clear steps, a checklist and somewhere to ask for help.',btn('Preview','preview','','eye')+btn('Check & publish','validation','primary','arrow'))}<div class="split" style="grid-template-columns:minmax(0,1fr) 340px"><div class="column"><section class="card pad"><div class="row between mb16"><h3>Handbook structure</h3><span class="note">Included in this draft</span></div>${[['Project overview','Cover, introduction and scope','file',false],['Getting started','4 steps · Access and roles','book',false],['Update website content','5 steps · Edit, preview and publish','book',true],['Manage your media','3 steps · Replace images safely','book',false],['Handoff checklist','4 required items · 1 optional','checkcircle',false],['Support & maintenance','Contact details and clear boundaries','help',false]].map(([t,s,i,selected],n)=>`<div class="guidechapter ${selected?'selected':''}" draggable="true" data-chapter="${n}"><span class="drag">⋮⋮</span><span class="rowicon">${ic(i)}</span><div class="grow"><h4>${t}</h4><div class="note mt8">${s}</div></div><button class="iconbtn" data-action="chapter-up" aria-label="Move section up">${ic('arrowup')}</button>${btn('Edit',n<1?'project':n<4?'editor':n===4?'request-confirmation':'settings','sm')}${n>0&&n<4?'<input type="checkbox" checked aria-label="Include guide in release">':''}</div>`).join('')}<p class="note mt16">Only included guides are published. Internal notes and client comments are excluded from the handbook and exports.</p></section><section class="card pad"><div class="row between mb16"><h3>Required handoff checklist</h3><span class="tag">Frozen at publication</span></div>${['Key website operations are documented','Access roles and permissions are explained','Support contact and escalation route are included','Maintenance responsibilities are clearly described'].map(x=>`<label class="check mb16"><input type="checkbox" checked><span>${x}</spa function validationPage(){const aiDone=S.aiAccepted||S.aiRejected;const privacy=S.privacyReviewed;const block=(!aiDone?1:0)+(!privacy?1:0)+(!S.paid?1:0);return shell(`${topTitle('One final check before handoff.','Fix blockers, acknowledge warnings, then publish an immutable release.',btn('Back to handbook','handbook','ghost','back'))}<div class="split"><div class="column"><div class="grid3">${stat('Blockers',String(block),block?'Must be fixed before publishing':'All blockers resolved','alert')}${stat('Warnings','1','Review and acknowledge','info')}${stat('Checks passed',String(8-block),'Current draft revision 18','checkcircle')}</div><section class="card"><div class="cardhead"><h3>Release readiness</h3>${pill(block?'Action needed':'Ready for final review',block?'amber':'green',true)}</div>${[[privacy,'Screenshot safety review',privacy?'All included images are reviewed.':'One screenshot has not completed the sensitive-information check.','redact'],[aiDone,'AI suggestions reviewed',aiDone?'Every suggestion is accepted or rejected.':'Step 02 contains an unreviewed AI suggestion.','ai-review'],[S.paid,'Active project entitlement',S.paid?'Project pack is active through January 9, 2027.':'A free draft cannot be published or exported.','paywall'],[true,'Draft saved','Saved revision 18 is the source for this check.','editor'],[true,'Required content and assets','No empty guides. All referenced images are available.','handbook'],[true,'Project limits','3 / 10 guides · 12 / 200 steps · 84 MiB / 1 GiB','billing']].map(([ok,t,d,r])=>`<div class="validationrow"><span style="color:${ok?'var(--brand)':'var(--danger)'}">${ic(ok?'checkcircle':'alert')}</span><div class="grow"><h4>${t}</h4><p>${d}</p></div>${ok?pill('Passed','green'):btn('Fix',r,'sm','arrow')}</div>`).join('')}</section><section class="card"><div class="cardhead"><h3>Warnings</h3><span class="pill amber">Requires acknowledgement</span></div><div class="pad"><div class="row start gap8"><span style="color:var(--amber)">${ic('info')}</span><div><h4>One step has no expected result.</h4><p class="caption mt8">Guide 03 · Step 02. A result makes the instruction easier to verify.</p></div></div><label class="check"><input id="warningAccept" type="checkbox" ${S.warningAcknowledged?'checked':''}><span>I reviewed this warning and accept it for this release.</span></label><div class="mt16">${field('Reason for publishing with this warning',textarea('warningReason',S.warningReason||'',2,'placeholder="Explain why this is acceptable…"'))}</div></div></section></div><aside class="column"><section class="card pad"><span class="eyebrow">NEXT PUBLISHED VERSION</span><h2 style="font-size:40px;margin:12px 0 16px">v${S.version+1}</h2><div class="kv"><span class="muted">Included guides</span><b>3</b></div><div class="kv"><span class="muted">Included steps</span><b>12</b></div><div class="kv"><span class="muted">Required checklist items</span><b>4</b></div><div class="divider"></div>${field('Change summary <span class="accent">*</span>',textarea('changeSummary',S.changeSummary||'Clarified preview-before-publish instructions and reviewed updated screenshots.',4))}${act(block?'Resolve blockers to publish':`Publish version v${S.version+1}`,'publish','primary block','arrow',`id="publishButton" ${block||!S.warningAcknowledged?'disabled':''}`)}<p class="note mt16">Publishing freezes this content. Previous receipts stay on the previous version. A new receipt request must be sent separately.</p></section>${notice('Checking again is required after any content change. This prototype simulates validation; it is not a security audit.','blue','info')}</aside></div>`,{project:true,tab:'handbook'});}

function versionsPage(){return shell(`${topTitle('Versions that stay true.','Published releases are immutable. Draft changes never rewrite a client receipt.',btn('Compare versions','diff','','history')+btn('Review new draft','validation','primary','arrow'))}<div class="split"><div>${[S.version,...(S.version>2?[2]:[]),1].map((v,i)=>`<section class="releasecard ${i===0?'current':''}"><div class="row between wrap"><div class="row gap8"><span class="rowicon">${ic('book')}</span><h2>Version v${v}</h2>${pill(i===0?'Current release':'Historical',i===0?'green':'',true)}</div>${btn('View handbook',i===0?'client':'client-history','sm','eye')}</div><p class="caption mt16">${v===1?'First complete website operations handbook.':'Updated the heading editor screenshot and clarified preview-before-publish instructions.'}</p><ul><li>${v===1?'Getting started, content updates and media management.':'Guide 02 · Steps 2–4 updated.'}</li><li>${v===1?'Four required handoff checklist items included.':'No changes to client access or maintenance scope.'}</li></ul><div class="row wrap gap8 mt16"><span class="tag">3 guides · 12 steps</span><span class="tag">${v===1?'Oct 6':'Oct 9'}, 2026 · 10:30 AM EDT</span><span class="tag">${v===1?'2 of 2 received':receiptRatio()}</span></div><div class="divider"></div><div class="row between wrap"><span class="monotext muted">${v===1?'sha256: 37e9…74bf':'sha256: 8fa2…d91c'}</span><div class="row gap8">${act('Copy to new draft','restore-version','ghost sm','copy',`data-version="${v}"`)}${act('Withdraw','withdraw-version','ghost sm','shield',`data-version="${v}"`)}</div></div></section>`).join('')}</div><aside class="column"><div class="card pad"><span class="eyebrow">IN PROGRESS</span><h3 class="mt16">Draft for version v${S.version+1}</h3><p class="caption mt8">You can edit freely here without changing the client’s current handbook.</p><div class="kv"><span class="muted">Draft revision</span><b>18</b></div><div class="kv"><span class="muted">Changed steps</s ></div></div><div class="alert mt24">${ic('history')}<div>Version v1 remains unchanged, including its comments and receipts. Restoring its content creates a new draft, never an overwrite.</div></div>`,{project:true,tab:'versions'});}
function memberRows(){const members=[['JL','Jordan Lee','jordan@northstar.example','Confirmer',!S.requested?'Not requested':S.newRequest?'Awaiting receipt':'Confirmed',!S.requested?'':S.newRequest?'amber':'green'],['AC','Ava Chen','ava@northstar.example','Confirmer',!S.requested?'Not requested':S.confirmed?'Confirmed':'Awaiting receipt',S.confirmed?'green':'amber'],['MR','Morgan Reed','morgan@northstar.example','Viewer','Invited','blue'],...S.members.map(m=>['CL',m.email.split('@')[0],m.email,m.role,'Invited','blue'])];return members.map(([initials,name,email,role,status,color],i)=>`<div class="memberline">${av(initials,i===1?'sand':i===2?'blue':'')}<div class="grow"><b class="small">${esc(name)}</b><div class="note">${esc(email)}</div></div><span class="role tag">${esc(role)}</span><div class="row gap8"><span class="note">Download</span><button class="switch on" data-action="member-download" aria-label="Allow ${esc(name)} to download" aria-pressed="true"></button></div>${pill(status,color)}<button class="iconbtn" data-action="member-menu" data-member-index="${i}" aria-label="Manage ${esc(name)}">${ic('more')}</button></div>`).join('');}

nd-client','','mail'):btn('Request receipt','request-confirmation','primary','checkcircle')}${btn('Review request','request-confirmation','ghost','arrow')}</div><p class="note mt16" style="margin-bottom:0">One reminder per 24 hours. A due date never creates automatic acceptance.</p></div></div></div></section></div><aside class="column"><div class="card pad"><h3>Share the right link</h3><p class="caption mt8">This stable link opens the current published version after the invited email is verified.</p><div class="outlineinfo monotext" style="font-size:10px;word-break:break-all">app.handlio.example/h/northstar-demo</div>${act('Copy invited-client link','copy-client-link','block mt16','copy')}<div class="divider"></div>${btn('Preview as a client','client','block sm','eye')}<p class="note mt16" style="margin-bottom:0">Prototype opens a sample client session. Production must not let an owner confirm for a client.</p></div><div class="card pad"><div class="row between"><h3>Open questions</h3><span class="count">3</span></div><p class="caption mt16">“Will changing the heading publish the page immediately?”</p><div class="note">Ava Chen · v${S.version} · Step 02</div>${btn('Respond to questions','questions','block sm mt16','chat')}</div></aside></div>`,{project:true,tab:'handoff'});}

function questionsPage(){return shell(`${topTitle('Questions, in context.','Every question belongs to the version and step your client was looking at.',btn('Back to handoff','handoff','ghost','back'))}<div class="row between mb24"><nav class="tabs" style="margin:0;min-width:300px"><button class="tab active" style="background:none;border-left:0;border-right:0;border-top:0" data-action="questions-all">Open <span class="count">${S.questionResolved?'2':'3'}</span></button><button class="tab" style="background:none;border-left:0;border-right:0;border-top:0" data-action="questions-resolved">Resolved <span class="count">1</span></button></nav><span class="tag">Version v${S.version}</span></div><div class="split"><div id="questionsList">${S.questions.map(q=>`<article class="questionitem"><div class="row between"><div class="row">${av('AC','sand')}<div><b class="small">Ava Chen</b><div class="note">Just now · v${S.version} · Step 02</div></div></div>${pill(q.blocking?'Blocking':'Open',q.blocking?'red':'amber')}</div><p>${esc(q.body)}</p>${act('Reply','reply-question','sm','chat')}</article>`).join('')}<article class="questionitem"><div class="row between"><div class="row">${av('AC','sand')}<div><b class="small">Ava Chen</b><div class="note">Today, 10:16 AM · v${S.version} · Step 02</div></div></div>${pill(S.questionResolved?'Resolved':S.blocking?'Blocking':'Open',S.questionResolved?'green':S.blocking?'red':'amber')}</div><h3 class="mt16">Will changing the heading publish immediately?</h3><p>I want to make sure we can review the new wording first. Does editing this field change the live website?</p><div class="row between wrap"><a href="#client" class="linkbtn small">View the referenced step ${ic('external')}</a><div class="row gap8">${act('Reply','reply-question','sm','chat')}${act(S.questionResolved?'View resolution':'Mark resolved','resolve-question','sm', 'checkcircle')}</div></div><div class="reply"><div class="row gap8">${av('AM')}<b class="small">Alex Morgan</b><span c roject:true,tab:'handoff'});}

function readerMain(history=false){const v=history?1:S.version;const section=S.readerSection??2;if(section===4)return `<div class="breadcrumb">Handbook ${ic('chevron')} Handoff checklist</div><h1>The handoff, clearly covered.</h1><p class="caption">These items are frozen into version v${v}. They record what Pine Studio provided, not whether you have learned each task.</p><div class="reviewchecks mt24">${['Key website operations are documented','Access roles and permissions are explained','Support contact and escalation route are included','Maintenance responsibilities are clearly described'].map(t=>`<div class="outlineinfo row start gap8">${ic('checkcircle')}<div><b class="small">${t}</b><div class="note mt8">Provided in version v${v} · Required item</div></div></div>`).join('')}</div>${btn(`Review receipt of v${v}`,'client-confirm','primary mt24','checkcircle')}`;if(section===5)return `<div class="breadcrumb">Handbook ${ic('chevron')} Support</div><h1>A clear route to support.</h1><p class="caption">Use the project questions for clarification. For new work outside this scope, contact Pine Studio.</p><div class="card pad mt24"><div class="row">${av('AM','big')}<div><h3>Alex Morgan</h3><div class="note">Pine Studio · Client contact</div></div></div><div class="divider"></div><div class="kv"><span class="muted">Support email</span><b>hello@pine.example</b></div><div class="kv"><span class="muted">Reference</span><b>Northstar · version v${v}</b></div></div><h2 class="mt32 mb16">Maintenance scope</h2><p class="caption">Routine content updates are covered in this handbook. New layouts, features or integrations need a separate discussion. No passwords or secret keys belong in a support request.</p>${btn('Ask a project question','client-question','primary','chat')}`;if(section===0)return `<span class="eyebrow">YOUR WEBSITE, HANDED OVER</span><h1>Your website operations handbook.</h1><p class="caption">A practical guide to everyday updates, the people who can make them, and where to ask for help.</p><div class="row gap8 mt24"><span class="tag">3 guides</span><span class="tag">12 steps</span><span class="tag">Version v${v}</span></div><div class="alert mt24">${ic('shield')}<div>Use your own account. Never post passwords, verification codes or private customer data in this handbook.</div></div>${[['Getting started','Check access and roles before you make a change.',1],['Update website content','Edit, preview and publish the page safely.',2],['Manage your media','Prepare images and replace assets carefully.',3]].map(([t,d,n])=>`<a href="#client" data-reader-section="${n}" class="guidechapter mt16"><span class="rowicon">${ic('book')}</span><div class="grow"><h3>${t}</h3><div class="note mt8">${d}</div></div>${ic('arrow')}</a>`).join('')}`;if(section===1)return `<span class="eyebrow">GUIDE 01 / 03</span><h1>Start with the right access.</h1><p class="caption">Check your role and your starting point before making changes to the website.</p><div class="readstep"><div class="row"><span class="stepbubble">1</span><h2>Use your own invited account</h2></div><p>Open the admin link your project owner provided separately. Sign in with your own account. This handbook never contains shared passwords.</p><div class="expected">${ic('checkcircle')}You are signed in and can see the admin navigation.</div></div><div class="readstep"><div class="row"><span class="stepbubble">2</span><h2>Check your role</h2></div><p>Your Content editor role should allow you to edit page text and media. Ask your project contact if Pages is missing. Do not try another person’s account.</p>${cms('pages',true)}</div><div class="readstep"><div class="row"><span class="stepbubble">3</span><h2>Prepare approved content</h2></div><p>Keep your approved replacement copy and images ready. Do not publish private customer information.</p><div class="expected">The approved content is ready before editing.</div></div>${act('Continue to content updates','reader-content','primary mt24','arrow')}`;if(section===3)return `<span class="eyebrow">GUIDE 03 / 03</span><h1>Keep your images in good shape.</h1><p class="caption">Prepare replacement images, update the correct asset and check the result.</p><div class="readstep"><div class="row"><span class="stepbubble">1</span><h2>Prepare the replacement image</h2></div><p>Use the dimensions agreed with Pine Studio. Remove private metadata and check that the image is authorized for use.</p><div class="expected">${ic('checkcircle')}Your replacement image is ready to review.</div></div><div class="readstep"><div class="row"><span class="stepbubble">2</span><h2>Replace the selected page image</h2></div><p>In the page editor, select the current cover and choose your prepared image. Preview before publishing.</p>${cms('edit',true)}</div><div class="readstep"><div class="row"><span class="stepbubble">3</span><h2>Add an accessible description</h2></div><p>Describe the relevant image content in the alternative text. Never include private details.</p></div><div class="readstep"><div class="row"><span class="stepbubble">4</span><h2>Preview before publishing</h2></div><p>Check the image crop and mobile appearance. Publish only after checking the preview.</p></div>${btn('Ask about image dimensions','client-question','mt24','chat')}`;return `<div class="breadcrumb">Your handbook ${ic('chevron')} Guide 02 ${ic('chevron')} <span>Content updates</span></div><div class="row gap8 mt24"><span class="eyebrow">GUIDE 02 / 03</span>${pill(`v${v}`,history?'amber':'green')}</div><h1>Update your website<br>with confidence.</h1><p class="caption">Make a text change, check the preview and publish when you are ready. Your live page stays unchanged until you publish.</p><div class="row wrap gap8 mt16 mb24"><span class="tag">${ic('user')} Content editor</span><span class="tag">5 steps</span><span class="tag">Reviewed by Pine Studio</span></div><div class="alert">${ic('info')}<div><b>Before you start</b><br>Sign in with your own Content editor account. Have the approved replacement copy ready.</div></div><section class="readstep" id="read-step-1"><div class="row between"><div class="row gap8"><span class="stepbubble">1</span><h2>Open the pages list</h2></div><button class="iconbtn" data-action="copy-step-link" aria-label="Copy link to step 1">${ic('link')}</button></div><p>In the admin sidebar, choose <b>Pages</b>. Open the <b>Home</b> page from the list.</p>${cms('pages',true)}<div class="expected">${ic('checkcircle')}The Home page editor is open and ready to edit.</div><div class="stepactions">${!history&&!S.publicSample&&S.clientRole!=='viewer'?btn('Ask about this step','client-question','ghost sm','chat'):''}${act('View image','zoom-image','ghost sm','search')}</div></section><section class="readstep" id="read-step-2"><div class="row gap8"><span class="stepbubble">2</span><h2>Update the page heading</h2></div><p>In the <b>Hero heading</b> field, replace the existing text with your approved copy. This changes the draft, not the live site.</p>${cms('edit',true)}<div class="expected">${ic('checkcircle')}The new heading appears in your draft. The live website is still unchanged.</div><div class="stepactions">${!history&&!S.publicSample&&S.clientRole!=='viewer'?btn('Ask about this step','client-question','ghost sm','chat'):''}</div></section><section class="readstep" id="read-step-3"><div class="row gap8"><span class="stepbubble">3</span><h2>${history?'Publish your changes':'Preview before publishing'}</h2></div><p>${history?'Choose Publish after editing your copy. This is historical text; see v2 for updated preview guidance.':'Open Preview. Check the edited heading at desktop and mobile widths before making the change live.'}</p><div class="expected">${ic('checkcircle')}${history?'See the current version for updated guidance.':'The preview matches the intended wording and layout.'}</div></section><section class="readstep"><div class="row gap8"><span class="stepbubble">4</span><h2>Publish the updated page</h2></div><p>When your preview is correct, choose <b>Publish changes</b>. Check that the confirmation message appears.</p></section><section class="readstep"><div class="row gap8"><span class="stepbubble">5</span><h2>Check the live page</h2></div><p>Open the live Home page and check the updated heading. If it still looks wrong after refreshing once, ask a question here.</p></section><div class="card pad mt24 soft"><div class="row between wrap"><div><h3>That’s this guide covered.</h3><p class="caption mt8" style="margin-bottom:0">Next: review the handoff checklist and any open questions.</p></div>${act('View checklist','reader-checklist','sm','arrow')}</div></div>`;}
function clientPage(history=false,question=false){const v=history?1:S.version;let page=`<div class="clientpage">${clientHeader()}${history?`<div class="clientstrip">${ic('history')}<span>You are viewing historical version v1. Current version is v${S.version}.</span>${btn('Open current version','client','ghost sm','arrow')}</div>`:S.publicSample?`<div class="clientstrip" style="background:#eff6e9;color:#557846">${ic('info')}Fictional public sample. No actual client data or receipt actions.</div>`:''}<div class="clientshell">${clientToc()}<main class="clientmain">${readerMain(history)}</main><aside class="clientright">${!S.publicSample?`<section class="requestbox"><div class="row gap8 mb16">${ic('checkcircle')}<h3>Your receipt is requested</h3></div><p style="font-size:12px">Review this handbook and its checklist, then confirm receipt of <b>version v${v}</b>.</p>${history?btn(`Review current v${S.version}`,'client','primary block sm','arrow'):S.clientRole==='viewer'?'<p class="note">Your Viewer role cannot submit a receipt.</p>':S.blocking?btn('Review blocking question','client-question','block sm danger','alert'):btn(`Review & confirm v${v}`,'client-confirm','primary block sm','checkcircle')}<p class="note" style="margin:12px 0 0">Not a contract acceptance or electronic signature.</p></section>`:''}<section class="card pad16 mt24"><h3>Questions about this guide?</h3><p>Ask in context. Questions are visible to project members with feedback access.</p>${S.publicSample?btn('Create your handbook','auth','block sm'):S.clientRole==='viewer'?'<p class="note">Read-only access. Ask the sender for feedback permission.</p>':btn('Ask a question','client-question','block sm','chat')}</section><section class="card pad16"><h3>What changed in v${v}?</h3><p>${history?'The initial handoff included access, content and media instructions.':'Updated editor screenshots and clarified preview-before-publish instructions.'}</p>${btn('Version history','client-history','ghost sm','history')}</section><div class="note">Need help?<br>Contact your project sender.<br><br>Client viewing does not mean the handoff is confirmed.</div></aside></div>${!history&&!S.publicSample&&S.clientRole==='confirmer'&&S.requested?`<div class="mobileonly" style="position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 18px 54px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px #21432b08;gap:10px"><a href="#client-question" class="btn" style="flex:1">${ic('chat')}Ask a question</a><a href="#client-confirm" class="btn primary" style="flex:1">Review v${v} ${ic('arrow')}</a></div>`:''}</div>`;if(question)page+=modal('Ask about this step',`Version v${v} · Guide 02 · Step 02 — Update the page heading`,`${notice('Your question is visible to the creator and project members with feedback access. Do not include passwords or private customer details.','','users')}${field('<span style="display:block;margin-top:24px">Your question</span>',textarea('clientQuestionBody','Will editing this field change the live page, or can I review a preview first?',5,'maxlength="2000"'))}<label class="check"><input type="checkbox" id="questionBlocking"><span><b>This blocks my receipt of this version.</b><br><span class="note">A blocking question must be resolved or withdrawn before confirmation can proceed.</span></span></label><p class="note mt24">You can add a correction or withdraw your question later, but you cannot silently replace the original.</p>`,btn('Cancel','client')+act('Send question','send-question','primary','chat'));return page;}
function clientConfirmPage(changed=false){if(changed)return `<div class="clientpage">${clientHeader()}<main class="clientcentral"><section class="card statusbox" style="margin-top:20px"><div class="successcircle" style="background:var(--amber-pale);color:var(--amber)">${ic('history')}</div><span class="eyebrow">VERSION CHANGED</span><h1 class="mt16 mb16">There is a newer version to review.</h1><p class="caption">While you were reviewing v2, a new release became current. Your confirmation was not submitted or carried forward.</p><div class="outlineinfo mt24"><div class="kv"><span class="muted">You were reviewing</span><b>Version v2</b></div><div class="kv"><span class="muted">New current release</span><b>Version v3</b></div><div class="kv"><span class="muted">Your receipt</span>${pill('Not submitted','amber')}</div></div>${act('Open the current version','open-new-version','primary block mt24','arrow')}<p class="note mt16">Read the updated content and new request before confirming. No automatic acceptance.</p></section></main></div>`;return `<div class="clientpage">${clientHeader()}<main class="clientcentral"><a href="#client" class="linkbtn small">${ic('back')} Back to handbook</a><span class="eyebrow" style="display:block;margin-top:28px">YOUR EXPLICIT RECEIPT</span><h1 style="margin:12px 0 15px">Confirm receipt of version v${S.version}.</h1><p class="caption">You are confirming receipt of the specific handbook and checklist below. This does not confirm future versions.</p><div class="card mt24"><div class="cardhead"><div class="row"><span class="rowicon">${ic('book')}</span><div><h3>Northstar website handoff</h3><div class="note mt8">Version v${S.version} · Published October 9, 2026</div></div></div>${pill(`v${S.version}`,'green')}</div><div class="pad"><div class="kv"><span class="muted">You are confirming as</span><b>Ava Chen · ava@northstar.example</b></div><div class="kv"><span class="muted">Scope</span><b>3 guides · 12 steps · 4 required items</b></div><div class="kv"><span class="muted">Snapshot</span><span class="monotext">8fa2…d91c</span></div><div class="divider"></div><h3 class="mb16">Required handoff items</h3>${['Key website operations are documented','Access roles and permissions are explained','Support contact and escalation route are included','Maintenance responsibilities are clearly described'].map(t=>`<div class="row start gap8 mb16"><span class="accent">${ic('checkcircle')}</span><div><b class="small">${t}</b><div class="note">Provided in this release</div></div></div>`).join('')}<div class="alert ${S.blocking?'red':'amber'} mt24">${ic(S.blocking?'alert':'chat')}<div><b>${S.blocking?'One blocking question remains.':'3 non-blocking questions remain open.'}</b><br>${S.blocking?'You cannot confirm until it is resolved or withdrawn.':'Image dimensions, contact scope and content preview. These remain in the project record.'}<a href="#client-question" class="linkbtn" style="display:block;margin-top:8px;font-size:11px">Review questions ${ic('arrow')}</a></div></div><div class="divider"></div><label class="check"><input type="checkbox" id="clientReceiptAck"><span>I have reviewed the stated handoff content and confirm receipt of <b>version v${S.version}</b> and its required checklist.</span></label><p class="note mt16">This is a version receipt for recordkeeping. It is not an electronic signature, legal identity verification or automatic acceptance of your project contract.</p>${act(`Confirm receipt of version v${S.version}`,'confirm-client','primary block mt24','checkcircle','id="confirmClientButton" disabled')}<p class="note center mt16" style="margin-bottom:0">Prototype action only. No real client confirmation is recorded.</p></div></div><div class="row between mt24"><span class="note">Verified sample client session</span><a href="#version-changed" class="linkbtn" style="font-size:11px">View version-change state</a></div></main></div>`;}
function clientDonePage(){return `<div class="clientpage">${clientHeader()}<main class="clientcentral"><section class="receipt"><div class="receiptcap"><div class="successcircle">${ic('check')}</div><span class="eyebrow">RECEIPT RECORDED · SAMPLE</span><h1 style="font-size:31px;margin:12px 0">You’ve confirmed version v${S.version}.</h1><p class="caption" style="margin-bottom:0">A clear record of the handbook you received.</p></div><div class="pad" style="padding:31px"><div class="kv"><span class="muted">Project</span><b>Northstar website handoff</b></div><div class="kv"><span class="muted">Version</span><b>v${S.version} · Published October 9, 2026</b></div><div class="kv"><span class="muted">Confirmed by</span><b>Ava Chen</b></div><div class="kv"><span class="muted">Verified email</span><span>ava@northstar.example</span></div><div class="kv"><span class="muted">Confirmed at</span><span>Oct 11, 2026 · 11:24 AM EDT</span></div><div class="kv"><span class="muted">Receipt reference</span><span class="monotext">rcpt_demo_v${S.version}_ava</span></div><div class="kv"><span class="muted">Scope</span><span>3 guides · 12 steps · 4 required items</span></div><div class="divider"></div>${notice('Future revisions will need a new request. This record remains attached to the version you just confirmed.','','history')}<div class="row wrap mt24">${btn('Back to your handbook','client','primary','book')}${act('Download handbook PDF','download-pdf','','download')}</div><p class="note mt24" style="margin-bottom:0">This prototype receipt is fictional. It is not a contract acceptance, an electronic signature or evidence of a real client action.</p></div></section></main></div>`;}
function unavailablePage(){return `<div class="clientpage">${clientHeader(true)}<main class="clientcentral"><section class="card statusbox" style="margin-top:25px"><span class="successcircle" style="background:#eff3e9;color:#809371">${ic('lock')}</span><h1 class="mb16">This handbook is not available.</h1><p class="caption">We can’t grant access with the current link and email session. Try verifying the invited email again, or contact the person who sent the link.</p><div class="outlineinfo mt24" style="text-align:left"><h3>What you can do</h3>${ticklist(['Use the original invitation link','Verify the exact email that was invited','Ask your sender to review access'])}<p class="note" style="margin-bottom:0">For privacy, project details and account billing information are not shown here.</p></div>${btn('Verify invited email','client-access','primary block mt24','mail')}${act('Report an access issue','contact-support','ghost block mt8','help')}<div class="note mt24">Reference: ACCESS_UNAVAILABLE · Prototype</div></section></main></div>`;}

function designPage(){return shell(`${topTitle('The Handlio interface system','A calm workspace for careful, client-facing work.','<span class="pill green">Design baseline v1.0</span>')}<div class="grid2 mb24"><section class="card pad"><span class="eyebrow">BRAND</span><div style="padding:29px 0">${logo()}</div><h2>Clear guides. Smooth handoffs.</h2><p class="caption mt16">The existing H mark connects documents with a forward arrow. Deep teal is reserved for primary action, trust and current state.</p><div class="row gap8">${pill('English interface')}${pill('Desktop creator')}${pill('Mobile client')}</div></section><section class="card pad"><span class="eyebrow">TYPOGRAPHY</span><h1 style="margin:20px 0 10px;font-size:36px">A clear handoff.</h1><h2 class="mb8">One project, thoughtfully organized.</h2><p class="caption">System sans-serif. Strong hierarchy, generous whitespace and short, precise interface copy.</p><div class="row gap8"><span class="tag">Display 60 / 66</span><span class="tag">H1 30 / 38</span><span class="tag">Body 14 / 21</span></div></section></div><section class="card pad mb24"><span class="eyebrow">COLOR TOKENS</span><div class="grid4 mt24">${[['Primary teal','#0D7D77','Primary actions & active states'],['Deep ink','#203B38','Headings & important content'],['Soft canvas','#F6F8F6','Workspace surface'],['Mint tint','#E8F4EF','Success & supportive context']].map(([n,c,d])=>`<div><div class="colorchip" style="background:${c};border:1px solid var(--line)"></div><b class="small">${n}</b><div class="note">${c} · ${d}</div></div>`).join('')}</div></section><div class="grid2"><section class="card pad designglyphs"><span class="eyebrow">COMPONENTS</span><div class="mt24">${act('Primary action','demo-button','primary','arrow')}${act('Secondary action','demo-button','','eye')}${act('Destructive','demo-button','danger','trash')}${btn('Disabled',null,'','lock','disabled')}</div><div class="row wrap gap8 mt8">${pill('Published','green',true)}${pill('Needs revie function setupCanvas(){const cv=document.getElementById('redactCanvas');if(!cv)return;redactionRects=[];drawingRect=null;let im=activeImage;const ready=image=>{cv.width=image.naturalWidth||image.width;cv.height=image.naturalHeight||image.height;cv._image=image;cv._imageWasLocal=Boolean(activeImage);if(!activeImage)redactionRects=[{x:27,y:cv.height-80,w:110,h:14},{x:cv.width*.47,y:cv.height*.48,w:cv.width*.20,h:18}];drawCanvas();};if(im)ready(im);else if(typeof SAMPLE_IMAGE!=='undefined'&&SAMPLE_IMAGE){const raw=new Image();raw.onload=()=>ready(raw);raw.src=SAMPLE_IMAGE;}else{const raw=document.createElement('canvas');raw.width=1080;raw.height=630;const c=raw.getContext('2d');c.fillStyle='#fbfcf7';c.fillRect(0,0,1080,630);c.fillStyle='#ecf2e8';c.fillRect(0,0,185,630);c.fillStyle='#234735';c.font='bold 24px Arial';c.fillText('✳ Northstar',25,45);c.font='17px Arial';['Overview','Pages','Media library','Team access','Settings'].forEach((t,i)=>c.fillText(t,25,125+i*47));c.font='bold 32px Arial';c.fillText('Edit the Home page',230,80);c.font='15px Arial';c.fillStyle='#78906d';c.fillText('PAGE TITLE',230,130);c.strokeStyle='#dce5d3';c.strokeRect(230,146,570,48);c.fillStyle='#385936';c.fillText('Home',250,176);c.fillStyle='#78906d';c.fillText('HERO HEADING',230,232);c.strokeRect(230,248,570,65);c.fillStyle='#385936';c.fillText('Designing spaces for a better everyday.',250,284);c.strokeRect(230,374,570,115);c.fillText('Approved copy goes here.',250,407);c.fillStyle='#0d7d77';c.fillRect(844,42,180,42);c.fillStyle='white';c.fillText('Save draft',893,69);ready(raw);}const point=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};cv.onpointerdown=e=>{e.preventDefault();const p=point(e);drawingRect={x:p.x,y:p.y,w:0,h:0};cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(!drawingRect)return;const p=point(e);drawingRect.w=p.x-drawingRect.x;drawingRect.h=p.y-drawingRect.y;drawCanvas();};cv.onpointeru  if(kind==='verify-owner'){if(fieldValue('ownerCode').replace(/\s/g,'')!=='123456'){showError('verifyError','For this demo, use 123456. No email is sent.');return;}S.email=S.otpMail;changeRoute('onboarding');}
 if(kind==='onboarding'){S.workspace=fieldValue('workspaceName').trim()||'My studio';S.owner=fieldValue('ownerName').trim()||'Alex Morgan';S.timezone=fieldValue('timezone');changeRoute('empty');}
 if(kind==='create-project'){const name=fieldValue('newProjectName').trim(),client=fieldValue('newClientName').trim();if(!name||!client){showError('newProjectError','Project and client names are required.');return;}if(name.length>120||client.length>120){showError('newProjectError','Use no more than 120 characters for either name.');return;}const url=fieldValue('newSupportUrl');if(url&&!/^https:\/\//.test(url)){showError('newProjectError','Support URLs must begin with https://.');return;}S.projectName=name;S.clientName=client;S.newProject=true;S.version=0;S.paid=false;S.requested=false;S.confirmed=false;S.aiAccepted=false;S.aiRejected=false;S.privacyReviewed=false;S.assetsUploaded=false;S.coverTitle=fieldValue('newHandbookTitle')||name;changeRoute('assets');toast('Free draft created locally. External publishing remains locked until project purchase.');}
 if(kind==='client-access'){const email=fieldValue('clientEmail').trim();if(!/^\S+@\S+\.\S+$/.test(email)){showError('clientAuthError','Enter a valid email address.');return;}S.clientEmail=email;S.otpMail=email;S.resendUntil=Date.now()+60000;changeRoute('client-code');}
 if(kind==='verify-client'){if(fieldValue('clientCode').replace(/\s/g,'')!=='123456'){showError('clientAuthError','Use 123456 in this demo. Verification is simulated.');return;}S.publicSample=false;S.readerSection=2;changeRoute('client');toast('Demo email verification completed. This does not implement real access control.');}
