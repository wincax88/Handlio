apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: handlio-data
  labels:
    app: handlio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: handlio
  labels:
    app: handlio
    cloud.sealos.io/app-deploy-manager: handlio
spec:
  replicas: 1
  # SQLite and file jobs have one writer. A rolling update would overlap writers.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: handlio
  template:
    metadata:
      labels:
        app: handlio
        cloud.sealos.io/app-deploy-manager: handlio
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: handlio
          image: ghcr.io/wincax88/handlio:bootstrap
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: handlio-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATA_DIR
              value: /app/data
            - name: TRUST_PROXY
              value: uniquelocal
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: handlio-data
---
apiVersion: v1
kind: Service
metadata:
  name: handlio
  labels:
    app: handlio
    cloud.sealos.io/app-deploy-manager: handlio
spec:
  type: ClusterIP
  selector:
    app: handlio
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: handlio
  labels:
    cloud.sealos.io/app-deploy-manager: handlio
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: handlio-fd5llv5c.cloud.sealos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handlio
                port:
                  number: 3001
  tls:
    - hosts: [handlio-fd5llv5c.cloud.sealos.io]
      secretName: wildcard-cloud-sealos-io-cert
